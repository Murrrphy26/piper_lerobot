[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "piper-train"
version = "0.1.0"
description = "Piper robot data collection, training, inference, and safety utilities"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["lerobot", "torch", "torchvision", "einops"]

[tool.setuptools.packages.find]
where = ["src"]
